# Keeps pr-guardian's own pins fresh (#47). Every update is a PR that pr-guardian reviews;
# action bumps touch .github/workflows, so they wait for the owner's human-override.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /config/claude-code
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      scanners:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
