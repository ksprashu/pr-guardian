# Reconciles every owned repo to the PR-only baseline. See scripts/governor.py.
name: governor
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report drift without changing anything
        type: boolean
        default: true
      repos:
        description: Comma-separated repo names (blank = all owned)
        type: string
        default: ""
      restack:
        description: Also reconcile opt-in stack-restack caller on selected repos
        type: boolean
        default: false
      batch:
        description: Max repos this run (0 = all)
        type: number
        default: 0
      offset:
        description: Skip this many repos (sorted by name)
        type: number
        default: 0
      rotate_secrets:
        description: Set every managed secret again on every repo in scope (after a key rotation)
        type: boolean
        default: false
      promote:
        description: Roll PRG_REF out to every repo without waiting for the canary ring
        type: boolean
        default: false
      stats:
        description: Add fleet review stats (open PRs, rounds, cost) to the report
        type: boolean
        default: false
permissions: {}
concurrency:
  group: governor
  cancel-in-progress: false
jobs:
  reconcile:
    # Secrets live in the `governor` environment, restricted to the default branch.
    # Dispatches from any other ref are skipped before a secret is read.
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: governor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write # drift report, written with the workflow token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reconcile
        env:
          GH_TOKEN: ${{ secrets.GOVERNOR_TOKEN }}
          REPORT_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRG_OWNER: ${{ github.repository_owner }}
          PRG_REF: ${{ vars.PRG_REF || 'v1' }}
          PRG_RESTACK_REPOS: ${{ vars.PRG_RESTACK_REPOS }}
          # Unset = GitHub Actions (15368). Set only once a dedicated verdict app exists (README).
          PRG_VERDICT_APP_ID: ${{ vars.PRG_VERDICT_APP_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          RESTACK: ${{ github.event_name == 'workflow_dispatch' && inputs.restack }}
          REPOS: ${{ inputs.repos }}
          BATCH: ${{ inputs.batch || 0 }}
          OFFSET: ${{ inputs.offset || 0 }}
          PRG_ROTATE_SECRETS: ${{ inputs.rotate_secrets || false }}
          PRG_PROMOTE: ${{ inputs.promote || false }}
          PRG_STATS: ${{ inputs.stats || vars.PRG_STATS || false }}
          PRG_CANARY: ${{ vars.PRG_CANARY }}
          PRG_EXEMPT: ${{ vars.PRG_EXEMPT }}
          PRG_DEPENDABOT_SECRETS: ${{ vars.PRG_DEPENDABOT_SECRETS || false }}
        run: |
          args=(--report-issue --batch "$BATCH" --offset "$OFFSET")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$RESTACK" = "true" ] && args+=(--restack)
          [ -n "$REPOS" ] && args+=(--repos "$REPOS")
          python3 scripts/governor.py "${args[@]}"
