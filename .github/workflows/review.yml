# Reusable pr-guardian review. Callers: templates/pr-guardian.yml (installed by the governor).
#
# route   -> decide review / verdict / skip                      (no token)
# announce-> early pending pr-guardian/verdict with the run link  (statuses write; no PR code)
# scan    -> scanners + linters on the PR head                   (read)
#            SARIF stays an artifact: code-scanning uploads open unresolvable
#            duplicate PR threads that block required conversation resolution.
# review  -> Antigravity CLI + forge skills, structured output   (read + GEMINI_API_KEY)
# publish -> threads, resolutions, summary + state               (pull-requests write; no model)
# verdict -> commit status pr-guardian/verdict on the head SHA   (statuses write; no model)
name: pr-guardian review
on:
  workflow_call:
    inputs:
      guardian_ref:
        description: pr-guardian ref the scripts are loaded from (match the uses@ ref)
        type: string
        required: true
      model:
        description: agy --model slug (gemini-4-argon-high = Gemini 4 Argon, High)
        type: string
        default: gemini-4-argon-high
    secrets:
      GEMINI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        description: optional; Claude Code reviews when Gemini is rate limited
        required: false

permissions: {}

env:
  # agent-skill-forge commit the review / security-review skills are loaded from.
  FORGE_REPO: ksprashu/agent-skill-forge
  FORGE_REF: f8c0b1a401913136e5ce5747ad49ae7455e29617 # review-security-hardening (PR #9) after rebase; repin to the merged main SHA

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.route.outputs.action }}
      pr: ${{ steps.route.outputs.pr }}
      head_sha: ${{ steps.route.outputs.head_sha }}
      escalate: ${{ steps.route.outputs.escalate }}
      reason: ${{ steps.route.outputs.reason }}
      bind_override: ${{ steps.route.outputs.bind_override }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ksprashu/pr-guardian
          ref: ${{ inputs.guardian_ref }}
          path: .prg
          persist-credentials: false
      - id: route
        run: python3 .prg/scripts/route.py
      - name: Job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          ACTION: ${{ steps.route.outputs.action }}
          REASON: ${{ steps.route.outputs.reason }}
          PR: ${{ steps.route.outputs.pr }}
        run: python3 .prg/scripts/step_summary.py route --action "$ACTION" --reason "$REASON" --pr "$PR"

  announce:
    # Early pending status, so the required check links to this run instead of showing
    # GitHub's generic "Expected" while scan and review work (#38). This job holds
    # statuses: write and nothing else: no checkout, no PR code, no model. verdict needs it,
    # so the final status always lands after this one.
    needs: route
    if: needs.route.outputs.action == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # head SHA lookup for comment and dispatch events
      statuses: write # the pending status
    steps:
      - name: Post pending pr-guardian/verdict
        # Fork and Dependabot runs get a read-only token: the POST fails and the run goes on.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.route.outputs.pr }}
          EVENT_SHA: ${{ needs.route.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha="$EVENT_SHA"
          if [ -z "$sha" ]; then
            sha="$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::notice::no head SHA for PR #$PR; pending status not posted"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -X POST \
            -f state=pending -f context=pr-guardian/verdict \
            -f description="Review running" -f target_url="$RUN_URL" > /dev/null \
            || echo "::notice::pending status not posted (read-only token, as on fork and Dependabot runs)"

  scan:
    needs: route
    if: needs.route.outputs.action == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      # The base this scan diffed against; publish records it so a retarget leaves the
      # verdict pending until a review runs against the new base (GHSA-6h55-p37r-jc34).
      base_ref: ${{ steps.pr.outputs.base_ref }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.route.outputs.pr }}
        run: |
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid,baseRefName,isCrossRepository \
            --jq '"head_sha=" + .headRefOid, "base_ref=" + .baseRefName, "fork=" + (.isCrossRepository|tostring)' \
            > "$RUNNER_TEMP/pr.env"
          if grep -qx 'fork=true' "$RUNNER_TEMP/pr.env"; then
            echo "::error::PR #$PR comes from a fork; pr-guardian does not run the model on fork code. The owner reviews it and applies human-override."
            exit 1
          fi
          cat "$RUNNER_TEMP/pr.env" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ksprashu/pr-guardian
          ref: ${{ inputs.guardian_ref }}
          path: .prg
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FORGE_REPO }}
          ref: ${{ env.FORGE_REF }}
          path: .forge
          persist-credentials: false
      - name: Install pinned scanners
        run: .prg/scripts/install_scanners.sh
      - name: Security scanners (leads, not findings)
        env:
          BASE: ${{ steps.pr.outputs.base_ref }}
        run: |
          python3 .forge/skills/security-review/scripts/run_scanners.py \
            --repo-root src --diff "origin/$BASE" \
            --json-out "$RUNNER_TEMP/scan.json" --sarif-out "$RUNNER_TEMP/scan.sarif" || echo "run_scanners exit $?"
      # --no-exec: never run linters, formatters, type checkers or configs from the
      # PR checkout (node_modules/.bin, eslint.config.*, conftest.py, ...). This
      # job is unprivileged but shares $RUNNER_TEMP with the scanner outputs, so
      # executing PR code here could forge scan.json/evidence.json (GHSA-7p2f-fx79-f4vw).
      - name: Linters and type checkers (detection only)
        env:
          BASE: ${{ steps.pr.outputs.base_ref }}
        run: |
          python3 .forge/skills/review/scripts/review_collector.py --no-exec \
            --path src --base "origin/$BASE" --out "$RUNNER_TEMP/evidence.json" || echo "collector exit $?"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prg-scan
          path: |
            ${{ runner.temp }}/scan.json
            ${{ runner.temp }}/scan.sarif
            ${{ runner.temp }}/evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python3 .prg/scripts/step_summary.py scan --scan "$RUNNER_TEMP/scan.json" \
            --collector "$RUNNER_TEMP/evidence.json"

  review:
    needs: [route, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scan.outputs.head_sha }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ksprashu/pr-guardian
          ref: ${{ inputs.guardian_ref }}
          path: .prg
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FORGE_REPO }}
          ref: ${{ env.FORGE_REF }}
          path: .forge
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: scan_artifact
        # When neither scanner step wrote output there is no artifact (#25). The job goes on:
        # build_context reports "scan not run" and triage then never skips the model.
        continue-on-error: true
        with:
          name: prg-scan
          path: ${{ runner.temp }}/scan
      - name: Build review context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.route.outputs.pr }}
        run: |
          mkdir -p "$RUNNER_TEMP/ctx" "$RUNNER_TEMP/out"
          python3 .prg/scripts/build_context.py --repo "$GITHUB_REPOSITORY" --pr "$PR" \
            --out "$RUNNER_TEMP/ctx/context.md" --scan "$RUNNER_TEMP/scan/scan.json" \
            --collector "$RUNNER_TEMP/scan/evidence.json" \
            --triage-out "$RUNNER_TEMP/triage.json"
          cat "$RUNNER_TEMP/triage.json"
          # Only the JSON boolean true skips the model; anything else reviews (#31).
          skip="$(jq -r '.skip_model == true' "$RUNNER_TEMP/triage.json" 2>/dev/null || true)"
          [ "$skip" = "true" ] || skip=false
          echo "skip_model=$skip" >> "$GITHUB_OUTPUT"
      - name: Install Antigravity CLI and skills
        if: steps.context.outputs.skip_model != 'true'
        run: |
          .prg/scripts/install_agy.sh
          mkdir -p ~/.gemini/antigravity-cli ~/.gemini/config/skills
          cp .prg/config/agy-settings.json ~/.gemini/antigravity-cli/settings.json
          mkdir -p ~/.claude/skills
          for s in review security-review; do
            cp -R ".forge/skills/$s" ~/.gemini/config/skills/
            cp -R ".forge/skills/$s" ~/.claude/skills/
          done
          "$HOME/.local/bin/agy" --version || true
      - name: Install Claude Code (rate-limit fallback)
        # Optional: if this fails, Gemini still reviews and run_model reports a missing claude.
        if: steps.context.outputs.skip_model != 'true'
        continue-on-error: true
        # npm ci checks every package against the committed lockfile hashes; the package's own
        # installer then links the platform binary that the lockfile already verified.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .prg/config/claude-code
          node .prg/config/claude-code/node_modules/@anthropic-ai/claude-code/install.cjs
          echo "$GITHUB_WORKSPACE/.prg/config/claude-code/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Review (Gemini via Antigravity CLI; Claude Code if rate limited)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          PRG_MODEL: ${{ inputs.model }}
          SKIP_MODEL: ${{ steps.context.outputs.skip_model }}
        run: |
          if [ "$SKIP_MODEL" != "true" ]; then
            if [ -z "$GEMINI_API_KEY" ]; then
              if [ "$GITHUB_ACTOR" = "dependabot[bot]" ]; then
                echo "::error::GEMINI_API_KEY is not available to this Dependabot run. Dependabot PRs only receive Dependabot secrets: run the governor with --dependabot-secrets, or add the key under Settings > Secrets and variables > Dependabot."
              else
                echo "::error::GEMINI_API_KEY secret is not set on this repo"
              fi
              exit 1
            fi
            agy models || echo "::warning::agy models failed"
          fi
          python3 .prg/scripts/run_model.py --context "$RUNNER_TEMP/ctx/context.md" \
            --triage "$RUNNER_TEMP/triage.json" \
            --findings-lib .forge/skills/review/scripts/findings.py \
            --out "$RUNNER_TEMP/out/findings.json" --usage-out "$RUNNER_TEMP/out/agy.json" \
            --workdir src
      - name: Job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SCAN_ARTIFACT: ${{ steps.scan_artifact.outcome }}
        run: |
          python3 .prg/scripts/step_summary.py review --triage "$RUNNER_TEMP/triage.json" \
            --scan "$RUNNER_TEMP/scan/scan.json" --usage "$RUNNER_TEMP/out/agy.json" \
            --findings "$RUNNER_TEMP/out/findings.json" --scan-artifact "$SCAN_ARTIFACT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: prg-review
          path: |
            ${{ runner.temp }}/out/findings.json
            ${{ runner.temp }}/out/agy.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [route, scan, review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ksprashu/pr-guardian
          ref: ${{ inputs.guardian_ref }}
          path: .prg
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FORGE_REPO }}
          ref: ${{ env.FORGE_REF }}
          path: .forge
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prg-review
          path: ${{ runner.temp }}/out
      - name: Validate findings (untrusted model output)
        run: |
          python3 .forge/skills/review/scripts/findings.py validate "$RUNNER_TEMP/out/findings.json"
      - name: Publish threads and summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.route.outputs.pr }}
          SHA: ${{ needs.scan.outputs.head_sha }}
          BASE: ${{ needs.scan.outputs.base_ref }}
          # The governor's caller rollout PR is exempt from the workflow tripwire only when
          # its caller is the template rendered with exactly this ref (GHSA-v7qp-pmhq-cf47).
          GUARDIAN_REF: ${{ inputs.guardian_ref }}
        # shell: bash sets pipefail, so a failed publish still fails the step through tee.
        shell: bash
        run: |
          python3 .prg/scripts/publish_review.py --repo "$GITHUB_REPOSITORY" --pr "$PR" --sha "$SHA" \
            --base="$BASE" --guardian-ref="$GUARDIAN_REF" --findings "$RUNNER_TEMP/out/findings.json" \
            --usage "$RUNNER_TEMP/out/agy.json" | tee "$RUNNER_TEMP/publish.json"
      - name: Job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 .prg/scripts/step_summary.py publish --result "$RUNNER_TEMP/publish.json"

  verdict:
    needs: [route, announce, scan, review, publish]
    # !cancelled(), not always(): a cancelled run (superseded by a newer one) must not stamp
    # "error" on the PR, whereas failed or timed-out jobs still report it (GHSA-6wg7-gfpx-8639).
    if: ${{ !cancelled() && needs.route.result == 'success' && needs.route.outputs.action != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ksprashu/pr-guardian
          ref: ${{ inputs.guardian_ref }}
          path: .prg
          persist-credentials: false
      - name: Post pr-guardian/verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.route.outputs.pr }}
          # The event's head when scan did not run or failed early, so verdict.py checks it
          # against the live head instead of judging whatever was pushed since.
          SHA: ${{ needs.scan.outputs.head_sha || needs.route.outputs.head_sha }}
          ESCALATE: ${{ needs.route.outputs.escalate }}
          REASON: ${{ needs.route.outputs.reason }}
          # First non-success of scan -> review -> publish, so a failed review reads as an error,
          # not as "no review yet" (publish is skipped when review fails).
          RESULT: >-
            ${{ needs.route.outputs.action != 'review' && 'skipped'
            || needs.scan.result != 'success' && needs.scan.result
            || needs.review.result != 'success' && needs.review.result
            || needs.publish.result }}
          # true only for the owner's own human-override application: bind it to SHA + base.
          # Stale overrides are removed on every verdict run, not only on synchronize
          # (GHSA-q4j9-99qr-cfhw).
          BIND_OVERRIDE: ${{ needs.route.outputs.bind_override }}
        # shell: bash sets pipefail, so a failed verdict still fails the step through tee.
        shell: bash
        run: |
          python3 .prg/scripts/verdict.py --repo "$GITHUB_REPOSITORY" --pr "$PR" --sha "$SHA" \
            --escalate "$ESCALATE" --reason "$REASON" --review-result "$RESULT" \
            --bind-override "$BIND_OVERRIDE" | tee "$RUNNER_TEMP/verdict.json"
      - name: Job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 .prg/scripts/step_summary.py verdict --result "$RUNNER_TEMP/verdict.json"
